<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NeuroVision Explorer</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/viewer-static/papaya.css">
    <script type="text/javascript" src="/viewer-static/papaya.js"></script>
    <style>
        :root {
            --primary-dark: #1a365d;
            --primary-light: #4299e1;
            --secondary-dark: #2d3748;
            --accent: #f6ad55;
            --background: #edf2f7;
            --text: #2d3748;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 1rem;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
            overflow: hidden;
        }
        
        .app-header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            color: white;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            flex-shrink: 0;
        }
        
        .app-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        .app-header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .viewer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            flex: 1;
            min-height: 0;
            height: calc(100vh - 180px);
        }
        
        @media (max-width: 1200px) {
            .viewer-grid {
                grid-template-columns: 1fr 1fr;
                height: auto;
            }
        }
        
        @media (max-width: 768px) {
            .viewer-grid {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
        
        .viewer-panel {
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s ease;
            height: 100%;
        }
        
        .viewer-panel:hover {
            transform: translateY(-4px);
        }
        
        .panel-header {
            padding: 1rem;
            background: var(--secondary-dark);
            color: white;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        
        .panel-header.original {
            background: linear-gradient(to right, #3182ce, #63b3ed);
        }
        
        .panel-header.predicted {
            background: linear-gradient(to right, #38a169, #68d391);
        }
        
        .panel-header.combined {
            background: linear-gradient(to right, #9f7aea, #b794f4);
        }
        
        .panel-content {
            flex: 1;
            min-height: 0;
            position: relative;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            overflow: hidden;
            height: calc(100% - 100px);
        }
        
        .panel-icon {
            width: 20px;
            height: 20px;
        }
        
        .status-bar {
            padding: 0.75rem;
            background: var(--secondary-dark);
            color: white;
            text-align: center;
            font-size: 0.9rem;
            flex-shrink: 0;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(66, 153, 225, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-light);
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .papaya {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>3D Image Viewer</h1>
            <p>Advanced 3D Medical Imaging Analysis</p>
        </header>
        
        <main class="viewer-grid">
        
            <div class="viewer-panel">
                <div class="panel-header original">
                    <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span>Original Scan</span>
                </div>
                <div class="panel-content">
                    <div class="loading-overlay" id="loading-original">
                        <div class="spinner"></div>
                    </div>
                    <div class="papaya" data-params="originalParams"></div>
                </div>
                <div class="status-bar">Axial View | Hounsfield Units</div>
            </div>
            
            
            <div class="viewer-panel">
                <div class="panel-header predicted">
                    <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                    </svg>
                    <span>Output mask</span>
                </div>
                <div class="panel-content">
                    <div class="loading-overlay" id="loading-predicted">
                        <div class="spinner"></div>
                    </div>
                    <div class="papaya" data-params="predictedParams"></div>
                </div>
                <div class="status-bar">Tissue Classification | Confidence 92%</div>
            </div>
            
           
            <div class="viewer-panel">
                <div class="panel-header combined">
                    <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <span>Combined View</span>
                </div>
                <div class="panel-content">
                    <div class="loading-overlay" id="loading-combined">
                        <div class="spinner"></div>
                    </div>
                    <div class="papaya" data-params="combinedParams"></div>
                </div>
                <div class="status-bar">Overlay Mode | Opacity 60%</div>
            </div>
        </main>
    </div>
    
    <script>
        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            const original = urlParams.get('original');
            const predicted = urlParams.get('predicted');
            
            if (!original || !predicted) {
                document.body.innerHTML = `
                    <div class="app-container" style="justify-content: center; align-items: center;">
                        <div style="background: white; padding: 2rem; border-radius: 12px; box-shadow: var(--card-shadow); text-align: center;">
                            <h2 style="color: #e53e3e; margin-bottom: 1rem;">Missing Parameters</h2>
                            <p>Required image parameters not found in URL.</p>
                            <p style="margin-top: 1rem;"><code>?original=URL&predicted=URL</code></p>
                        </div>
                    </div>
                `;
                return;
            }

            if (typeof papaya !== 'undefined') {
                // Configure viewers with modern settings
                const viewerConfig = {
                    showControls: true,
                    showOrientation: true,
                    radiological: false,
                    smoothDisplay: true,
                    allowScroll: true,
                    showSliceNumber: true,
                    showScale: true,
                    showCrosshairs: true,
                    showValue: true
                };
                
                const originalParams = {
                    ...viewerConfig,
                    images: [original],
                    name: "Original Scan"
                };
                
                const predictedParams = {
                    ...viewerConfig,
                    images: [predicted],
                    name: "AI Segmentation",
                    colorMap: "hot"
                };
                
                const combinedParams = {
                    ...viewerConfig,
                    images: [original, predicted],
                    name: "Fusion View",
                    combineParam: true,
                    overlayOpacity: 0.6,
                    overlayColorMap: "cool"
                };
                
                // Initialize viewers
                papaya.Container.resetViewer(0, originalParams);
                papaya.Container.resetViewer(1, predictedParams);
                papaya.Container.resetViewer(2, combinedParams);
                
                // Hide loading spinners when ready
                setTimeout(() => {
                    document.querySelectorAll('.loading-overlay').forEach(el => {
                        el.style.display = 'none';
                    });
                }, 1000);
            } else {
                document.body.innerHTML = `
                    <div class="app-container" style="justify-content: center; align-items: center;">
                        <div style="background: white; padding: 2rem; border-radius: 12px; box-shadow: var(--card-shadow); text-align: center;">
                            <h2 style="color: #e53e3e; margin-bottom: 1rem;">Viewer Error</h2>
                            <p>Failed to load the medical imaging viewer library.</p>
                            <p>Please refresh the page or contact support.</p>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
